<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barangay Admin Login — ResQ</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script defer src="assets/js/storage.js"></script>
  <script defer src="assets/js/ui.js"></script>
  <script defer src="assets/js/auth.js"></script>
</head>
<body>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <main class="auth-shell">
    <section class="admin-auth-card">
      <header class="admin-auth-banner">
        <a href="index.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Back to Command Overview
        </a>

        <div class="brand-row">
          <div class="brand-icon-box" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Barangay Admin Login</h1>
            <p class="brand-subtitle">Sign in to manage incident dispatches</p>
          </div>
        </div>
      </header>

      <div class="auth-body">
        <div id="adminAuthBanner" class="alert-banner hidden" role="alert"></div>

        <form id="adminLoginForm" novalidate>
          <div class="form-group">
            <label for="adminIdentifier" class="form-label">
              Admin Username or Email<span class="required-mark">*</span>
            </label>
            <input
              type="text"
              id="adminIdentifier"
              name="identifier"
              class="form-control"
              placeholder="e.g., barangay_admin or admin@barangayresq.ph"
              autocomplete="username"
              required
            >
            <p id="adminIdentifierError" class="field-error"></p>
          </div>

          <div class="form-group">
            <label for="adminPassword" class="form-label">
              Password<span class="required-mark">*</span>
            </label>
            <div class="password-wrapper">
              <input
                type="password"
                id="adminPassword"
                name="password"
                class="form-control"
                placeholder="Enter official password"
                autocomplete="current-password"
                required
              >
              <button
                type="button"
                class="password-toggle-btn"
                data-toggle-password="adminPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <p id="adminPasswordError" class="field-error"></p>
          </div>

          <button type="submit" id="adminLoginBtn" class="btn btn-primary btn-block">
            Sign In to Command Dashboard
          </button>
        </form>
      </div>

      <footer class="auth-footer">
        ResQ Barangay Emergency &amp; Incident Reporting System
      </footer>
    </section>
  </main>
</body>
</html>
