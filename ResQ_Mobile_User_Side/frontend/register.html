<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Registration — ResQ</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script defer src="assets/js/storage.js"></script>
  <script defer src="assets/js/ui.js"></script>
  <script defer src="assets/js/auth.js"></script>
</head>
<body>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <main class="auth-shell">
    <section class="mobile-frame">
      <header class="intro-banner">
        <a href="index.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Back to Welcome Page
        </a>

        <div class="brand-row">
          <div class="brand-icon-box" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Resident Registration</h1>
            <p class="brand-subtitle">Prevent anonymous reports &amp; verify your profile</p>
          </div>
        </div>
      </header>

      <div class="auth-body">
        <div id="authBanner" class="alert-banner hidden" role="alert"></div>

        <form id="residentRegisterForm" novalidate>
          <div class="form-group">
            <label for="regFullName" class="form-label">
              Full Name<span class="required-mark">*</span>
            </label>
            <input
              type="text"
              id="regFullName"
              name="full_name"
              class="form-control"
              placeholder="e.g., Maria Clara Reyes"
              autocomplete="name"
              required
            >
            <p id="regFullNameError" class="field-error"></p>
          </div>

          <div class="form-group">
            <label for="regEmail" class="form-label">
              Email Address<span class="required-mark">*</span>
            </label>
            <input
              type="email"
              id="regEmail"
              name="email"
              class="form-control"
              placeholder="e.g., maria.reyes@email.com"
              autocomplete="email"
              required
            >
            <p id="regEmailError" class="field-error"></p>
          </div>

          <div class="form-group">
            <label for="regContact" class="form-label">
              Mobile / Contact Number<span class="required-mark">*</span>
            </label>
            <input
              type="tel"
              id="regContact"
              name="contact_number"
              class="form-control"
              placeholder="e.g., 09171234567"
              autocomplete="tel"
              required
            >
            <p id="regContactError" class="field-error"></p>
          </div>

          <div class="form-group">
            <label for="regAddress" class="form-label">
              Barangay Purok / Street Address<span class="required-mark">*</span>
            </label>
            <input
              type="text"
              id="regAddress"
              name="address"
              class="form-control"
              placeholder="e.g., Purok 3, Sampaguita St."
              autocomplete="street-address"
              required
            >
            <p id="regAddressError" class="field-error"></p>
          </div>

          <div class="form-group">
            <label for="regPassword" class="form-label">
              Password (minimum 8 characters)<span class="required-mark">*</span>
            </label>
            <div class="password-wrapper">
              <input
                type="password"
                id="regPassword"
                name="password"
                class="form-control"
                placeholder="Create a strong password"
                autocomplete="new-password"
                required
              >
              <button
                type="button"
                class="password-toggle-btn"
                data-toggle-password="regPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <p id="regPasswordError" class="field-error"></p>
          </div>

          <div class="form-group">
            <label for="regConfirmPassword" class="form-label">
              Confirm Password<span class="required-mark">*</span>
            </label>
            <div class="password-wrapper">
              <input
                type="password"
                id="regConfirmPassword"
                name="confirm_password"
                class="form-control"
                placeholder="Re-enter your password"
                autocomplete="new-password"
                required
              >
              <button
                type="button"
                class="password-toggle-btn"
                data-toggle-password="regConfirmPassword"
                aria-label="Show confirm password"
                aria-pressed="false"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <p id="regConfirmPasswordError" class="field-error"></p>
          </div>

          <button type="submit" id="registerSubmitBtn" class="btn btn-accent btn-block">
            Create Resident Account
          </button>
        </form>
      </div>

      <footer class="auth-footer">
        Already registered? <a href="login.html">Sign In Here</a>
      </footer>
    </section>
  </main>
</body>
</html>
