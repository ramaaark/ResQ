<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Sign In — ResQ</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script defer src="assets/js/storage.js"></script>
  <script defer src="assets/js/ui.js"></script>
  <script defer src="assets/js/auth.js"></script>
</head>
<body>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <main class="auth-shell">
    <section class="mobile-frame">
      <header class="intro-banner">
        <a href="index.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Back to Welcome Page
        </a>

        <div class="brand-row">
          <div class="brand-icon-box" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="M12 8v4"></path>
              <path d="M12 16h.01"></path>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Resident Sign In</h1>
            <p class="brand-subtitle">Verify your identity to report incidents</p>
          </div>
        </div>
      </header>

      <div class="auth-body">
        <div id="authBanner" class="alert-banner hidden" role="alert"></div>

        <form id="residentLoginForm" novalidate>
          <div class="form-group">
            <label for="loginIdentifier" class="form-label">
              Email Address or Mobile Number<span class="required-mark">*</span>
            </label>
            <input
              type="text"
              id="loginIdentifier"
              name="identifier"
              class="form-control"
              placeholder="e.g., juan@email.com or 09171234567"
              autocomplete="username"
              required
            >
            <p id="loginIdentifierError" class="field-error"></p>
          </div>

          <div class="form-group">
            <label for="loginPassword" class="form-label">
              Password<span class="required-mark">*</span>
            </label>
            <div class="password-wrapper">
              <input
                type="password"
                id="loginPassword"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >
              <button
                type="button"
                class="password-toggle-btn"
                data-toggle-password="loginPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <p id="loginPasswordError" class="field-error"></p>
          </div>

          <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block">
            Sign In to Report
          </button>
        </form>
      </div>

      <footer class="auth-footer">
        No resident account yet? <a href="register.html">Register Here</a>
      </footer>
    </section>
  </main>
</body>
</html>
